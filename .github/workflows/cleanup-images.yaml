name: Cleanup Container Images

on:
  schedule:
    # Domingo, 2h UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'So mostra o que seria apagado'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup Images
    uses: mrops-br/gha-workflows/.github/workflows/_cleanup-images.yaml@main
    permissions:
      packages: write
      contents: read
    with:
      image-name: testing-throttling-api
      # As demais opcoes usam os padroes do workflow compartilhado:
      #   keep-n      3      (3 builds de dev + 3 de pr)
      #   older-than  14 days
      #   exclude-tags        latest, dev-latest e qualquer tag semver
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
