name: Cleanup Container Images

on:
  schedule:
    # Sunday, 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only report what would be deleted'
        required: false
        type: boolean
        default: true
      repair-broken-images:
        description: 'Also delete already-broken indexes. DESTROYS TAGS - run in dry-run first'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    name: Cleanup Images
    uses: mrops-br/gha-workflows/.github/workflows/_cleanup-images.yaml@main
    permissions:
      packages: write
      contents: read
    with:
      image-name: testing-throttling-api
      # Everything else takes the shared workflow defaults:
      #   keep-n       3         (3 develop builds + 3 pull request builds)
      #   older-than   14 days
      #   exclude-tags latest, dev-latest and any semver tag
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
      repair-broken-images: ${{ github.event_name == 'workflow_dispatch' && inputs.repair-broken-images || false }}
