name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      # Staging is fed from the release candidate, so the pipeline has to run
      # on these branches - without them a release branch never starts it.
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        type: choice
        options: [stg, prd]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: &app_name throttling-api
  PROJECT_NAME: &project_name testing

jobs:
  pipeline:
    name: CI/CD Pipeline
    uses: mrops-br/gha-workflows/.github/workflows/_pipeline-golang.yaml@main
    permissions:
      contents: write         # For creating tags and releases
      packages: write         # For pushing to GHCR
      id-token: write         # For cosign signing
      security-events: write  # For vulnerability scanning
      actions: read           # For downloading workflow artifacts
    secrets: inherit
    with:
      # Application configuration
      app-name: *app_name
      image-name: ${{ github.repository }}
      project-name: *project_name

      # Go configuration
      go-version: '1.21'
      working-directory: 'server'
      dockerfile: server/Dockerfile

      # CI options
      enable-lint: false
      enable-test: false
      enable-coverage: false
      enable-lint-dockerfile: true
      dockerfile-failure-threshold: 'error'

      # Security
      enable-signing: true
      enable-scanning: true
      scan-severity: 'CRITICAL,HIGH'

      # Release automation (on merge to main)
      enable-auto-release: true
      enable-changelog: true
      changelog-config: cliff.toml
